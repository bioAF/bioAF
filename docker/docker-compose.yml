services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-bioaf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioaf} -d ${POSTGRES_DB:-bioaf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/bioaf/bioaf-backend:${BIOAF_IMAGE_TAG:-latest}
    # Hard stop for the backend's bounded shutdown: uvicorn request grace 10 s, then the
    # lifespan's drain 10 s, cancellation 20 s, and resource cleanup 5 s. Compose's default 10 s
    # would SIGKILL a Terraform stop (10 s TERM + 5 s KILL) mid-cleanup. A maximum, not a delay.
    stop_grace_period: 60s
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    environment: &backend_environment
      PYTHONPATH: /app
      BIOAF_DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://bioaf:CHANGE_ME@db:5432/bioaf}
      BIOAF_JWT_SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_TO_RANDOM_STRING}
      BIOAF_ENCRYPTION_KEYS: ${BIOAF_ENCRYPTION_KEYS:-}
      BIOAF_EDGE_TOKEN: ${BIOAF_EDGE_TOKEN:-}
      BIOAF_ENVIRONMENT: ${BIOAF_ENVIRONMENT:-production}
      # Real backends unless the host env file sets a mode (an empty value also means kubernetes here).
      # The application has no default; it normalizes case/whitespace and rejects unknown values.
      BIOAF_COMPUTE_MODE: ${BIOAF_COMPUTE_MODE:-kubernetes}
      BIOAF_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # One centralized log path. stdout: the host's Ops Agent ships the backend's JSON lines (setup
      # and start configure it on GCE). Set direct only where nothing collects container output.
      BIOAF_LOG_DELIVERY: ${BIOAF_LOG_DELIVERY:-stdout}
      # Data exports: a direct download stalled this long is closed (nginx send_timeout matches);
      # a signed link that cannot stay valid this long is refused rather than issued short.
      BIOAF_EXPORT_TRANSFER_STALL_SECONDS: ${BIOAF_EXPORT_TRANSFER_STALL_SECONDS:-60}
      BIOAF_EXPORT_SIGNED_MIN_TTL_SECONDS: ${BIOAF_EXPORT_SIGNED_MIN_TTL_SECONDS:-3600}
      # Installation metrics (docs/installation-metrics.md): reported only after an admin opts in. Set
      # BIOAF_INSTALL_METRICS_DISABLED=1 in the host env file to stop reporting whatever was chosen.
      # The PostHog pair overrides the destination built into the image, both or neither.
      BIOAF_INSTALL_METRICS_DISABLED: ${BIOAF_INSTALL_METRICS_DISABLED:-false}
      BIOAF_POSTHOG_PROJECT_TOKEN: ${BIOAF_POSTHOG_PROJECT_TOKEN:-}
      BIOAF_POSTHOG_HOST: ${BIOAF_POSTHOG_HOST:-}
      # Internal webhook receivers (docs/configuration.md#webhook-destination-settings). Empty: public
      # HTTPS receivers only. A JSON list set by the operator in the host env file; restart to apply.
      BIOAF_WEBHOOK_INTERNAL_DESTINATIONS: ${BIOAF_WEBHOOK_INTERNAL_DESTINATIONS:-}
      # NFS checksum verification (docs/deployment-guide.md#provisioning-nfs-for-verification): the UIDs
      # producers write NFS as. Unset: checksum-required NFS files stay unready with a visible error.
      BIOAF_NFS_PRODUCER_UIDS: ${BIOAF_NFS_PRODUCER_UIDS:-}
      # Checksum verifications run at once per backend (1-8; docs/configuration.md#file-verification-settings).
      BIOAF_FILE_VERIFICATION_CONCURRENCY: ${BIOAF_FILE_VERIFICATION_CONCURRENCY:-1}
      BIOAF_DEBUG: "false"
      BIOAF_USE_SECRET_MANAGER: "false"
      # A restore checks the database volume has room for the restored copy and its WAL before creating it.
      BIOAF_RESTORE_DB_VOLUME_DIR: /var/lib/bioaf/db-volume
    volumes:
      - ../update-requests:/app/update-requests
      - ../update-status:/app/update-status
      # An organization-CA certificate staged for the host to install (plan 03.5A); created 0700 by ./bioaf.
      - ../tls-upload:/app/tls-upload
      - ../tls-report:/app/tls-report:ro
      # Recovery backups the backend writes before upgrading the database (backend/entrypoint.sh,
      # app/schema_upgrade.py). On the host, beside ./bioaf backup's dumps, so they outlive the
      # container. Read fresh on every update, so the first update from any older ./bioaf gets it.
      - ../backups:/app/backups
      # The database's volume, read-only, used only to measure its free space (BIOAF_RESTORE_DB_VOLUME_DIR).
      - pgdata:/var/lib/bioaf/db-volume:ro
      # Mount the host .env read-write so the entrypoint can bootstrap
      # BIOAF_ENCRYPTION_KEYS on upgrades from < 0.13.0. See backend/entrypoint.sh
      # and decisions/ADR-047-data-at-rest-encryption.md. Mount is a no-op
      # on installs where the key is already populated.
      - ./.env:/host/.env
      # The networking applier reads the live nginx cert to decide whether
      # the configured FQDN actually has a valid cert installed. Mounting
      # the same docker/certs dir as nginx (read-only) lets it see what
      # nginx serves.
      - ${SSL_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        # 1.5 GiB (not 512 MiB): the backend runs `terraform apply` as a
        # subprocess in this container, and the large cloud providers (esp. the
        # AWS provider) plus uvicorn exceed 512 MiB during a deploy, OOM-killing
        # the process. Fits comfortably on the 4 GiB app VMs (GCP e2-medium /
        # AWS t3.medium) alongside the db/frontend/nginx limits.
        limits:
          memory: 1536M
    restart: unless-stopped

  # Protected notebook gateway (plan 03.5A): the backend image as a separate process with no bioAF API
  # route and no database upgrade (the backend's entrypoint owns that). nginx serves it on :8443.
  notebook-gateway:
    image: ghcr.io/bioaf/bioaf-backend:${BIOAF_IMAGE_TAG:-latest}
    entrypoint: ["python", "-m", "uvicorn", "app.notebook_gateway.app:create_app", "--factory"]
    command: ["--host", "0.0.0.0", "--port", "8001", "--no-server-header"]
    environment: *backend_environment
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  frontend:
    image: ghcr.io/bioaf/bioaf-frontend:${BIOAF_IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      NGINX_ENVSUBST_FILTER: "^BIOAF_"
      # Added to every API request nginx proxies, after X-Real-IP is overwritten with the peer nginx saw.
      BIOAF_EDGE_TOKEN: ${BIOAF_EDGE_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      # Rendered by the nginx image at start, substituting only BIOAF_ variables (the edge token).
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # Update gate (plan 03A): ./bioaf update pauses Work Node launches here while it replaces the backend.
      - ../update-gate:/etc/nginx/update-gate:ro
      - ${SSL_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      # Let's Encrypt HTTP-01 webroot. certbot --webroot writes challenge
      # tokens to this directory on the host; nginx serves them at
      # http://<fqdn>/.well-known/acme-challenge/<token>. The host path is
      # created by install-gcp.sh (VM provisioning) or install.sh
      # prepare-letsencrypt; if it does not exist yet, docker-compose will
      # create an empty mount and the location block returns 404 until
      # certbot writes the first challenge.
      - ${LETSENCRYPT_WEBROOT:-/var/www/letsencrypt}:/var/www/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - notebook-gateway
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  pgdata:
