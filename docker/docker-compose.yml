services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-bioaf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioaf} -d ${POSTGRES_DB:-bioaf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/bioaf/bioaf-backend:${BIOAF_IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      PYTHONPATH: /app
      RUN_MIGRATIONS: "false"
      BIOAF_DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://bioaf:CHANGE_ME@db:5432/bioaf}
      BIOAF_JWT_SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_TO_RANDOM_STRING}
      BIOAF_ENCRYPTION_KEYS: ${BIOAF_ENCRYPTION_KEYS:-}
      BIOAF_ENVIRONMENT: ${BIOAF_ENVIRONMENT:-production}
      BIOAF_COMPUTE_MODE: ${BIOAF_COMPUTE_MODE:-k8s}
      BIOAF_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      BIOAF_DEBUG: "false"
      BIOAF_USE_SECRET_MANAGER: "false"
    volumes:
      - ../update-requests:/app/update-requests
      - ../update-status:/app/update-status
      # Mount the host .env read-write so the entrypoint can bootstrap
      # BIOAF_ENCRYPTION_KEYS on upgrades from < 0.13.0. See backend/entrypoint.sh
      # and decisions/ADR-047-data-at-rest-encryption.md. Mount is a no-op
      # on installs where the key is already populated.
      - ./.env:/host/.env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  frontend:
    image: ghcr.io/bioaf/bioaf-frontend:${BIOAF_IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      # Let's Encrypt HTTP-01 webroot. certbot --webroot writes challenge
      # tokens to this directory on the host; nginx serves them at
      # http://<fqdn>/.well-known/acme-challenge/<token>. The host path is
      # created by install-gcp.sh (VM provisioning) or install.sh
      # prepare-letsencrypt; if it does not exist yet, docker-compose will
      # create an empty mount and the location block returns 404 until
      # certbot writes the first challenge.
      - ${LETSENCRYPT_WEBROOT:-/var/www/letsencrypt}:/var/www/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  pgdata:
