# Rendered by the nginx image from /etc/nginx/templates (docker-compose.yml): only BIOAF_ variables
# such as ${BIOAF_EDGE_TOKEN} are substituted; nginx's own $variables are left as they are.
upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

# Redirect all HTTP to HTTPS, with two exceptions: the health endpoint and
# the ACME HTTP-01 challenge path.
server {
    listen 80;
    server_name _;

    location /api/health/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Let's Encrypt HTTP-01 challenge. certbot --webroot writes token files
    # to /var/www/letsencrypt/.well-known/acme-challenge/ on the host; this
    # block serves them over plain HTTP so the ACME CA can fetch them. The
    # path must stay on port 80: HTTPS redirect breaks the challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-eval' is required for the Nextflow HTML report iframe: Plotly
    # JITs vector math via new Function(...) and a srcdoc iframe inherits
    # this CSP per the HTML spec. Without it, plots stay blank.
    # connect-src must allow the browser's direct (presigned-URL) calls to the
    # active cloud's object store: GCS on GCP, S3 on AWS. This static config lists
    # both so one image serves either cloud; the S3 hosts are per-bucket virtual-
    # hosted regional names (bucket.s3.<region>.amazonaws.com), so *.amazonaws.com
    # covers any region. TODO(cloud-neutral): drive this from cloud_provider so an
    # install only advertises its own cloud's storage host (aws-prep cleanup #2d).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://storage.googleapis.com https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Work Node launches pause while an update checks and replaces the backend (plan 03A). ./bioaf update
    # creates this marker in the host's update-gate/ directory only for that window and removes it once
    # the new backend is ready; other Work Node requests (list, stop, heartbeat) are unaffected.
    location = /api/v1/work-nodes/sessions {
        set $work_node_launch_paused "";
        if ($request_method = POST) {
            set $work_node_launch_paused "post";
        }
        if (-f /etc/nginx/update-gate/work-node-launch.closed) {
            set $work_node_launch_paused "${work_node_launch_paused}-closed";
        }
        if ($work_node_launch_paused = "post-closed") {
            add_header Retry-After 120 always;
            add_header Content-Type application/json always;
            return 503 '{"detail": "bioAF is updating. Try launching the work node again in a few minutes."}';
        }
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Bioaf-Edge-Token "${BIOAF_EDGE_TOKEN}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The same backend timeouts and limits as /api/ below: a launch can outlast nginx's defaults.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 60s;
        client_max_body_size 500M;
    }

    # API routes go to FastAPI backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        # The peer nginx saw (any incoming X-Real-IP is replaced); the edge token is set at the end.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Terraform operations (deploy/teardown) stream SSE events and
        # can take up to 30+ minutes for GKE cluster create/delete.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Downloads: a client that accepts nothing for 60 s is dropped (nginx's default, pinned to
        # match the backend's export stall limit, BIOAF_EXPORT_TRANSFER_STALL_SECONDS). The proxy
        # timeouts above are the backend legs, not client progress. Data exports send
        # X-Accel-Buffering: no, which nginx honours here, so an export streams through rather than
        # spooling to nginx's temporary files.
        send_timeout 60s;

        # For file uploads
        client_max_body_size 500M;

        # The edge token that lets the backend trust X-Real-IP (plan 03B); an incoming
        # X-Bioaf-Edge-Token is replaced. Last in the block: its braces are substituted at start.
        proxy_set_header X-Bioaf-Edge-Token "${BIOAF_EDGE_TOKEN}";
    }

    # OpenAPI docs
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Everything else goes to Next.js frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Next.js HMR if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
