<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1830" viewBox="0 0 1280 1830" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">bioAF system architecture</title>
  <desc id="architecture-desc">Researchers and LIMS clients connect through nginx to a Docker Compose application host. The Next.js web app calls a single FastAPI backend, which also serves the public Integration API. The backend owns background workers, the event bus and Terraform execution, persists records in PostgreSQL, and accesses cloud infrastructure through the BioAF Adapter Layer. Runtime providers manage Kubernetes pipelines, notebooks and cellxgene, standalone SSH Work Node virtual machines, and file storage. A separate container image lifecycle builds and publishes versioned images for Kubernetes workloads. GCP is the reference deployment; implemented AWS paths are shown with partial support explicitly noted. External integrations include LLM providers, literature sources, email, Slack and webhooks. Security, audit, logging, backup and update controls span the application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .brand { font-size: 44px; font-weight: 700; fill: #087f6b; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #526375; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; fill: #526375; }
      .heading { font-size: 26px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 20px; fill: #526375; }
      .label { font-size: 19px; fill: #526375; }
      .center { text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .boundary { fill: #ffffff; stroke: #c7d4df; stroke-width: 1.5; }
      .app { fill: #f0f6ff; stroke: #b8d1f1; stroke-width: 1.5; }
      .cloud { fill: #edf9f4; stroke: #a6d6c4; stroke-width: 1.5; }
      .integration { fill: #f6f2ff; stroke: #d4c6f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="1830" fill="#f8fafc"/>
  <text x="64" y="73" class="brand">bioAF</text>
  <text x="220" y="73" class="title">System architecture</text>
  <text x="64" y="110" class="subtitle">Research records, reproducible analysis and cloud compute in one web control plane.</text>

  <!-- All application traffic enters through the same reverse proxy. -->
  <g id="clients">
    <rect x="100" y="150" width="460" height="78" rx="14" class="app"/>
    <rect x="720" y="150" width="460" height="78" rx="14" class="boundary"/>
    <text x="330" y="184" class="heading center">Researchers</text>
    <text x="330" y="211" class="small center">Web browser</text>
    <text x="950" y="184" class="heading center">LIMS &amp; external clients</text>
    <text x="950" y="211" class="small center">Service accounts + API keys</text>
  </g>

  <g id="application-host">
    <rect x="64" y="258" width="1152" height="806" rx="20" class="boundary"/>
    <text x="88" y="294" class="section">APPLICATION HOST</text>
    <text x="1180" y="294" class="small" text-anchor="end">Docker Compose</text>

    <path d="M 330 228 V 320" class="edge"/>
    <path d="M 950 228 V 320" class="edge"/>
    <rect x="100" y="320" width="1080" height="66" rx="12" fill="#283e50"/>
    <text x="640" y="361" class="heading center" style="fill: #ffffff">nginx: HTTPS, TLS termination and request routing</text>

    <path d="M 335 386 V 440" class="edge"/>
    <text x="353" y="421" class="label">Web pages</text>
    <rect x="100" y="440" width="470" height="78" rx="12" class="app"/>
    <text x="335" y="474" class="heading center">Next.js / React web app</text>
    <text x="335" y="502" class="small center">TypeScript + Tailwind CSS</text>
    <path d="M 335 518 V 574" class="edge"/>
    <text x="353" y="553" class="label">Browser API requests</text>
    <path d="M 950 386 V 574" class="edge"/>
    <text x="970" y="480" class="label">API requests</text>

    <!-- One FastAPI application, including its mounted Integration API. -->
    <rect x="100" y="574" width="1080" height="214" rx="14" class="app"/>
    <text x="128" y="614" class="heading">FastAPI backend</text>
    <text x="1152" y="612" class="small" text-anchor="end">Browser API + public Integration API</text>
    <text x="128" y="654" class="body">Experiments, pipelines, files, provenance and exports</text>
    <text x="128" y="688" class="body">Lab Knowledge / SDRs, literature, paper validation and assistant</text>
    <line x1="128" y1="712" x2="1152" y2="712" stroke="#c7d9ee"/>
    <text x="128" y="750" class="small">Owned background workers · Event bus · Terraform executor</text>

    <path d="M 250 788 V 844" class="edge"/>
    <path d="M 820 788 V 844" class="edge"/>
    <rect x="100" y="844" width="300" height="176" rx="12" class="cloud"/>
    <text x="124" y="884" class="heading">PostgreSQL 16</text>
    <text x="124" y="925" class="small">Records and provenance</text>
    <text x="124" y="955" class="small">Immutable audit trail</text>
    <text x="124" y="985" class="small">Application configuration</text>

    <rect x="460" y="844" width="720" height="176" rx="12" fill="#fff8ea" stroke="#e6c789" stroke-width="1.5"/>
    <text x="486" y="884" class="heading">BioAF Adapter Layer (BAL)</text>
    <text x="486" y="922" class="small">Runtime: compute, storage, notebooks, Work Nodes, cellxgene</text>
    <text x="486" y="954" class="small">Platform: identity, image builds, secrets, messaging, billing, logs</text>
    <text x="486" y="989" class="small" style="fill: #8d5b11">Typed provider contracts + capability checks</text>
  </g>

  <!-- Provider access, rather than a sequence in which workloads execute. -->
  <path d="M 820 1020 V 1096 H 240" class="bus"/>
  <path d="M 820 1096 H 1040" class="bus"/>
  <path d="M 240 1096 V 1140" class="edge"/>
  <path d="M 640 1096 V 1140" class="edge"/>
  <path d="M 1040 1096 V 1140" class="edge"/>
  <circle cx="640" cy="1096" r="3.5" fill="#64748b"/>
  <circle cx="820" cy="1096" r="3.5" fill="#64748b"/>

  <g id="cloud-runtime">
    <rect x="64" y="1140" width="352" height="182" rx="14" class="cloud"/>
    <text x="88" y="1179" class="heading">Kubernetes cluster</text>
    <text x="88" y="1217" class="body">GKE / EKS</text>
    <text x="88" y="1258" class="small">Pipelines · Jupyter · RStudio</text>
    <text x="88" y="1291" class="small">cellxgene (GCP reference)</text>

    <rect x="464" y="1140" width="352" height="182" rx="14" class="cloud"/>
    <text x="488" y="1179" class="heading">SSH Work Nodes</text>
    <text x="488" y="1217" class="body">GCE / EC2</text>
    <text x="488" y="1258" class="small">Standalone virtual machines</text>
    <text x="488" y="1291" class="small">Versioned VM images</text>

    <rect x="864" y="1140" width="352" height="182" rx="14" class="cloud"/>
    <text x="888" y="1179" class="heading">Files &amp; artifacts</text>
    <text x="888" y="1217" class="body">GCS / S3 · NFS option</text>
    <text x="888" y="1258" class="small">Inputs, outputs and notebooks</text>
    <text x="888" y="1291" class="small">Backups and references</text>
  </g>

  <!-- This lifecycle is an inset, separate from the runtime-provider arrows. -->
  <g id="container-image-lifecycle">
    <rect x="64" y="1380" width="752" height="198" rx="14" class="boundary"/>
    <text x="88" y="1418" class="heading">Container image lifecycle</text>
    <rect x="88" y="1444" width="214" height="70" rx="10" fill="#f0f6ff"/>
    <text x="195" y="1473" class="small center">Cloud Build</text>
    <text x="195" y="1499" class="small center">/ CodeBuild</text>
    <path d="M 302 1479 H 330" class="edge"/>
    <rect x="330" y="1444" width="244" height="70" rx="10" fill="#fff8ea"/>
    <text x="452" y="1473" class="small center">Artifact Registry</text>
    <text x="452" y="1499" class="small center">/ ECR</text>
    <path d="M 574 1479 H 602" class="edge"/>
    <rect x="602" y="1444" width="190" height="70" rx="10" fill="#edf9f4"/>
    <text x="697" y="1473" class="small center">Kubernetes</text>
    <text x="697" y="1499" class="small center">workloads</text>
    <text x="88" y="1552" class="small">Backend requests builds; workloads pull versioned images.</text>
  </g>

  <!-- The backend, not a workload cluster, owns these integrations. -->
  <path d="M 1180 732 H 1240 V 1479 H 1216" class="edge"/>
  <g id="external-integrations">
    <rect x="864" y="1380" width="352" height="198" rx="14" class="integration"/>
    <text x="888" y="1418" class="heading">External integrations</text>
    <text x="888" y="1461" class="body">LLM providers</text>
    <text x="888" y="1496" class="body">Literature sources</text>
    <text x="888" y="1531" class="small">Email · Slack · webhooks</text>
  </g>

  <g id="application-controls">
    <rect x="64" y="1610" width="1152" height="86" rx="12" class="integration"/>
    <text x="88" y="1644" class="small" style="fill: #57427b">JWT + scoped API keys · Organization isolation · RBAC · Immutable audit trail</text>
    <text x="88" y="1677" class="small" style="fill: #57427b">JSON logs · Checksummed backups + strict restores · Managed updates</text>
  </g>

  <text x="64" y="1738" class="small">GCP is the reference deployment. AWS paths shown are implemented; full platform parity is incomplete.</text>
  <text x="64" y="1768" class="small">One cloud per installation. AWS cellxgene and several platform-service adapters remain incomplete.</text>
  <text x="64" y="1798" class="label">Arrows show requests and provider access. Browser file transfers can also use signed object-store URLs.</text>
</svg>
