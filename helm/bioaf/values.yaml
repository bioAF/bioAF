backend:
  image:
    repository: ghcr.io/bioaf/bioaf-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  port: 8000
  env:
    BIOAF_ENVIRONMENT: production
    BIOAF_GCP_PROJECT_ID: ""
    BIOAF_GCS_BUCKET: ""
    BIOAF_LOG_LEVEL: info

frontend:
  image:
    repository: ghcr.io/bioaf/bioaf-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 3000

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: bioaf-cert
    kubernetes.io/ingress.global-static-ip-name: bioaf-ip

# Data-at-rest encryption (Fernet / MultiFernet). BIOAF_ENCRYPTION_KEYS is
# read from a Kubernetes Secret rather than the ConfigMap because losing this
# value loses every encrypted column in the database. Operators must create
# this Secret (and back it up alongside the DB dump) before deploying.
#
#   kubectl create secret generic bioaf-encryption \
#     --from-literal=keys="$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
encryption:
  secretName: bioaf-encryption
  secretKey: keys

backupsBucket: ""

configBackup:
  schedule: "0 2 * * *"
  retentionDays: 7
  image:
    repository: ghcr.io/bioaf/bioaf-backend
    tag: latest
    pullPolicy: IfNotPresent

dbBackup:
  schedule: "0 3 * * *"
  image:
    repository: ghcr.io/bioaf/bioaf-backend
    tag: latest
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: bioaf-backend
  annotations:
    iam.gke.io/gcp-service-account: ""

monitoring:
  enabled: true
