backend:
  image:
    repository: ghcr.io/bioaf/bioaf-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  port: 8000
  env:
    BIOAF_ENVIRONMENT: production
    BIOAF_GCP_PROJECT_ID: ""
    BIOAF_GCS_BUCKET: ""
    BIOAF_LOG_LEVEL: info

frontend:
  image:
    repository: ghcr.io/bioaf/bioaf-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 3000

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: bioaf-cert
    kubernetes.io/ingress.global-static-ip-name: bioaf-ip

# Data-at-rest encryption (Fernet / MultiFernet). BIOAF_ENCRYPTION_KEYS is
# read from a Kubernetes Secret, populated automatically by the chart on
# first `helm install` (see templates/secret-encryption.yaml). The Secret is
# annotated with helm.sh/resource-policy=keep so a `helm uninstall` does NOT
# delete it; losing the key value makes every encrypted DB column
# unrecoverable, so operators should back the Secret up separately from the
# DB dump (e.g., into Google Secret Manager).
#
# To bring your own key (e.g., rotation procedure, KMS-wrapped DEK), pre-
# create the Secret BEFORE `helm install`:
#
#   kubectl create secret generic bioaf-encryption \
#     --from-literal=keys=<your-fernet-key>
#
# The chart's `lookup` check will see it and leave it alone.
encryption:
  secretName: bioaf-encryption
  secretKey: keys

backupsBucket: ""

configBackup:
  schedule: "0 2 * * *"
  retentionDays: 7
  image:
    repository: ghcr.io/bioaf/bioaf-backend
    tag: latest
    pullPolicy: IfNotPresent

dbBackup:
  schedule: "0 3 * * *"
  image:
    repository: ghcr.io/bioaf/bioaf-backend
    tag: latest
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: bioaf-backend
  annotations:
    iam.gke.io/gcp-service-account: ""

monitoring:
  enabled: true
