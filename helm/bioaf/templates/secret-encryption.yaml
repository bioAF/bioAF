{{- /*
Data-at-rest encryption key for sensitive DB columns (ADR-047).

Auto-generated on first install so non-technical operators don't have to
remember to create this Secret out-of-band. On subsequent `helm upgrade`s,
`lookup` finds the existing Secret in the cluster and we re-use the same
key value, so the key never rotates accidentally (that would orphan every
encrypted row in the database).

If an operator wants to manage the key themselves (rotation, KMS-wrapped
DEK, etc.), they can pre-create the Secret before the first `helm install`:

  kubectl create secret generic bioaf-encryption \
    --from-literal=keys=<their fernet key>

`lookup` will find that Secret and the chart will leave it alone.

Fernet keys are urlsafe-base64(32 random bytes). Helm's `randBytes` returns
standard base64; we substitute `+`->`-` and `/`->`_` to make it urlsafe, then
strip any chance of a stray newline. The output is the 44-char string that
cryptography.Fernet accepts as-is.

Limitation: `helm template` (offline rendering) cannot do `lookup` against a
live cluster, so it always generates a fresh key. Use `helm install` / `helm
upgrade`, not `helm template | kubectl apply`, for the idempotent behavior.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.encryption.secretName -}}
{{- if not $existing -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.encryption.secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.encryption.secretKey }}: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | trim | quote }}
{{- end }}
