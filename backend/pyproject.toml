[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioaf-backend"
version = "2026.9.1"
description = "bioAF control plane backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    # Security floors below mirror requirements.txt, which is what CI and the
    # backend image actually install. Keep the two in step: a looser floor here
    # lets `uv lock` resolve back onto a vulnerable version.
    "pydantic-settings>=2.14.2",
    "bcrypt>=4.1",
    "google-cloud-secret-manager>=2.18",
    "google-cloud-iam>=2.14",
    "google-cloud-compute>=1.19",
    "httpx>=0.27",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.13.0",
    "pyasn1>=0.6.4",
    "h5py>=3.10",
    "PyMuPDF>=1.24",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_any_generics = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["assignment", "arg-type", "attr-defined", "union-attr", "return-value", "var-annotated", "import-untyped", "dict-item"]
