name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Tag & Release
    # Skip the bot's own release commits to avoid infinite loops.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      new_release: ${{ steps.check_entries.outputs.has_entries }}
    steps:
      # The job token checks out and is not kept: the GPG importer, setup-uv and the build scripts run without a
      # repository credential in git configuration. The public tag fetch below needs none. Only the push step
      # authenticates, with RELEASE_PAT.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Imports the maintainer's GPG key so the release commit and tag are
      # signed and show as Verified on GitHub. The action also sets the git
      # committer identity to the key's UID (Brent Mills
      # <brent.c.mills@gmail.com>); that email must stay a verified email on
      # the account, or signatures will show Unverified.
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      # The uv version the backend image copies (docker/Dockerfile.backend).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Check for changelog entries
        id: check_entries
        run: |
          ENTRIES=$(find changes/unreleased -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$ENTRIES" >> "$GITHUB_OUTPUT"
          if [ "$ENTRIES" -gt 0 ]; then
            echo "has_entries=true" >> "$GITHUB_OUTPUT"
            echo "Found $ENTRIES changelog entries, proceeding with release"
          else
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            echo "No changelog entries under changes/unreleased/, skipping release"
          fi

      - name: Compute next CalVer
        if: steps.check_entries.outputs.has_entries == 'true'
        id: compute
        run: |
          git fetch --tags --force
          Y=$(date -u +%Y)
          M=$(date -u +%-m)
          MAX_N=$(git tag --list "v${Y}.${M}.*" \
            | sed "s|^v${Y}\.${M}\.||" \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -1)
          if [ -z "$MAX_N" ]; then
            N=0
          else
            N=$((MAX_N + 1))
          fi
          VERSION="${Y}.${M}.${N}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $VERSION (tag: $TAG)"

      - name: Assemble changelog section
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          {
            echo "## ${TAG}"
            echo
            # The glob expands in sorted order; README.md is the directory's instructions, not an entry.
            for f in changes/unreleased/*.md; do
              [ -f "$f" ] && [ "$(basename "$f")" != "README.md" ] || continue
              cat "$f"
              echo
            done
          } > /tmp/new_section.md

          # Capture the bullets-only body for the GitHub Release notes
          # (strip the leading "## tag" header and the blank line after it).
          tail -n +3 /tmp/new_section.md > /tmp/release_body.md

          # Prepend the new section to RELEASE_NOTES.md, immediately before
          # the first existing "## v" header. If none exists, append at end.
          HEADER_LINE=$(grep -n '^## v' RELEASE_NOTES.md | head -1 | cut -d: -f1 || true)
          if [ -n "$HEADER_LINE" ]; then
            BEFORE=$((HEADER_LINE - 1))
            head -n "$BEFORE" RELEASE_NOTES.md > /tmp/RELEASE_NOTES.new
            cat /tmp/new_section.md >> /tmp/RELEASE_NOTES.new
            tail -n +"$HEADER_LINE" RELEASE_NOTES.md >> /tmp/RELEASE_NOTES.new
          else
            cat RELEASE_NOTES.md > /tmp/RELEASE_NOTES.new
            echo >> /tmp/RELEASE_NOTES.new
            cat /tmp/new_section.md >> /tmp/RELEASE_NOTES.new
          fi
          mv /tmp/RELEASE_NOTES.new RELEASE_NOTES.md

      - name: Clear consumed changelog snippets
        if: steps.check_entries.outputs.has_entries == 'true'
        run: |
          find changes/unreleased -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -delete

      - name: Update version in source files
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          # Python project: replace the top-level version = "..." line under [project].
          # The regex pins to a line starting with "version = " to avoid hitting
          # dependency specifiers.
          sed -i.bak -E 's/^(version = ")[^"]*(")/\1'"$VERSION"'\2/' backend/pyproject.toml
          rm -f backend/pyproject.toml.bak

          # frontend: update package.json safely as JSON.
          node -e "
            const fs = require('fs');
            const path = 'frontend/package.json';
            const v = process.env.VERSION;
            if (!v) { console.error('VERSION env var is empty'); process.exit(1); }
            const j = JSON.parse(fs.readFileSync(path, 'utf8'));
            j.version = v;
            fs.writeFileSync(path, JSON.stringify(j, null, 2) + '\n');
          "

          echo "Updated versions:"
          grep '^version' backend/pyproject.toml
          grep '"version"' frontend/package.json

      # The lock records the project version, so the bump leaves it stale and `uv sync --locked` (the image build
      # from this tag, CI) would refuse it. Without --upgrade, uv keeps every third-party selection; the check proves
      # the committed pair agrees. Routine dependency updates arrive as reviewed pull requests, never here.
      - name: Refresh the lock for the new version
        if: steps.check_entries.outputs.has_entries == 'true'
        working-directory: backend
        run: |
          uv lock
          uv lock --check
          git diff --stat -- uv.lock

      # RELEASE_PAT is a fine-grained PAT with Contents: write on this repo. The PAT inherits its owner's identity,
      # which has the Admin RepositoryRole bypass on the main-protective ruleset, so the workflow's commit + tag push
      # to main is accepted. Only this step receives it: git gets it from a credential helper given on the push's own
      # command line, which reads this step's environment when asked. It is never written to git configuration or a
      # remote URL, and never printed. A missing PAT fails here, before anything is committed.
      - name: Commit, tag, and push
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is not available to this workflow; nothing was committed, tagged or pushed."
            exit 1
          fi
          git add backend/pyproject.toml backend/uv.lock frontend/package.json RELEASE_NOTES.md changes/unreleased
          # -S signs the commit; -s makes a signed annotated tag (-m avoids the
          # editor in CI). Both also follow from commit.gpgsign/tag.gpgsign set
          # by the import step, but the explicit flags keep the intent clear.
          git commit -S -m "chore: release ${TAG} [skip ci]"
          git tag -s "$TAG" -m "Release ${TAG}"
          # Push the commit and the tag atomically. If the push is rejected
          # (concurrent merge raced us), the workflow fails and the next push
          # to main will re-run this job with a fresh N.
          # The first -c clears any inherited helper; the second answers git's credential request from RELEASE_PAT.
          # shellcheck disable=SC2016 # $RELEASE_PAT is expanded by the helper when git calls it, not here.
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$RELEASE_PAT"; fi; }; f' \
            push origin HEAD:main "$TAG"

      - name: Create GitHub Release
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release_body.md

  publish-images:
    name: Publish Docker Images
    needs: release
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/bioaf/bioaf-backend:${{ needs.release.outputs.tag }}
            ghcr.io/bioaf/bioaf-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: docker/Dockerfile.frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=
          tags: |
            ghcr.io/bioaf/bioaf-frontend:${{ needs.release.outputs.tag }}
            ghcr.io/bioaf/bioaf-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push cellxgene
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.cellxgene
          push: true
          tags: |
            ghcr.io/bioaf/bioaf-cellxgene:${{ needs.release.outputs.tag }}
            ghcr.io/bioaf/bioaf-cellxgene:latest
          cache-from: type=gha,scope=cellxgene
          cache-to: type=gha,mode=max,scope=cellxgene
