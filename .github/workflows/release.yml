name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Tag & Release
    # Skip the bot's own release commits to avoid infinite loops.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      new_release: ${{ steps.check_entries.outputs.has_entries }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # RELEASE_PAT is a fine-grained PAT with Contents: write on this repo.
          # The PAT inherits its owner's identity, which has the Admin
          # RepositoryRole bypass on the main-protective ruleset, so the
          # workflow's commit + tag push to main is accepted.
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true

      # Imports the maintainer's GPG key so the release commit and tag are
      # signed and show as Verified on GitHub. The action also sets the git
      # committer identity to the key's UID (Brent Mills
      # <brent.c.mills@gmail.com>); that email must stay a verified email on
      # the account, or signatures will show Unverified.
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Check for changelog entries
        id: check_entries
        run: |
          ENTRIES=$(find changes/unreleased -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$ENTRIES" >> "$GITHUB_OUTPUT"
          if [ "$ENTRIES" -gt 0 ]; then
            echo "has_entries=true" >> "$GITHUB_OUTPUT"
            echo "Found $ENTRIES changelog entries, proceeding with release"
          else
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            echo "No changelog entries under changes/unreleased/, skipping release"
          fi

      - name: Compute next CalVer
        if: steps.check_entries.outputs.has_entries == 'true'
        id: compute
        run: |
          git fetch --tags --force
          Y=$(date -u +%Y)
          M=$(date -u +%-m)
          MAX_N=$(git tag --list "v${Y}.${M}.*" \
            | sed "s|^v${Y}\.${M}\.||" \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -1)
          if [ -z "$MAX_N" ]; then
            N=0
          else
            N=$((MAX_N + 1))
          fi
          VERSION="${Y}.${M}.${N}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $VERSION (tag: $TAG)"

      - name: Assemble changelog section
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          {
            echo "## ${TAG}"
            echo
            for f in $(ls changes/unreleased/*.md 2>/dev/null | grep -v 'README\.md$' | sort); do
              cat "$f"
              echo
            done
          } > /tmp/new_section.md

          # Capture the bullets-only body for the GitHub Release notes
          # (strip the leading "## tag" header and the blank line after it).
          tail -n +3 /tmp/new_section.md > /tmp/release_body.md

          # Prepend the new section to RELEASE_NOTES.md, immediately before
          # the first existing "## v" header. If none exists, append at end.
          HEADER_LINE=$(grep -n '^## v' RELEASE_NOTES.md | head -1 | cut -d: -f1 || true)
          if [ -n "$HEADER_LINE" ]; then
            BEFORE=$((HEADER_LINE - 1))
            head -n "$BEFORE" RELEASE_NOTES.md > /tmp/RELEASE_NOTES.new
            cat /tmp/new_section.md >> /tmp/RELEASE_NOTES.new
            tail -n +"$HEADER_LINE" RELEASE_NOTES.md >> /tmp/RELEASE_NOTES.new
          else
            cat RELEASE_NOTES.md > /tmp/RELEASE_NOTES.new
            echo >> /tmp/RELEASE_NOTES.new
            cat /tmp/new_section.md >> /tmp/RELEASE_NOTES.new
          fi
          mv /tmp/RELEASE_NOTES.new RELEASE_NOTES.md

      - name: Clear consumed changelog snippets
        if: steps.check_entries.outputs.has_entries == 'true'
        run: |
          find changes/unreleased -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -delete

      - name: Update version in source files
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          # Python projects: replace the top-level version = "..." line under [project].
          # The regex pins to a line starting with "version = " to avoid hitting
          # dependency specifiers.
          sed -i.bak -E 's/^(version = ")[^"]*(")/\1'"$VERSION"'\2/' backend/pyproject.toml
          sed -i.bak -E 's/^(version = ")[^"]*(")/\1'"$VERSION"'\2/' cli/pyproject.toml
          rm -f backend/pyproject.toml.bak cli/pyproject.toml.bak

          # frontend: update package.json safely as JSON.
          node -e "
            const fs = require('fs');
            const path = 'frontend/package.json';
            const v = process.env.VERSION;
            if (!v) { console.error('VERSION env var is empty'); process.exit(1); }
            const j = JSON.parse(fs.readFileSync(path, 'utf8'));
            j.version = v;
            fs.writeFileSync(path, JSON.stringify(j, null, 2) + '\n');
          "

          echo "Updated versions:"
          grep '^version' backend/pyproject.toml cli/pyproject.toml
          grep '"version"' frontend/package.json

      - name: Commit, tag, and push
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          git add backend/pyproject.toml cli/pyproject.toml frontend/package.json RELEASE_NOTES.md changes/unreleased
          # -S signs the commit; -s makes a signed annotated tag (-m avoids the
          # editor in CI). Both also follow from commit.gpgsign/tag.gpgsign set
          # by the import step, but the explicit flags keep the intent clear.
          git commit -S -m "chore: release ${TAG} [skip ci]"
          git tag -s "$TAG" -m "Release ${TAG}"
          # Push the commit and the tag atomically. If the push is rejected
          # (concurrent merge raced us), the workflow fails and the next push
          # to main will re-run this job with a fresh N.
          git push origin HEAD:main "$TAG"

      - name: Create GitHub Release
        if: steps.check_entries.outputs.has_entries == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release_body.md

  publish-images:
    name: Publish Docker Images
    needs: release
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/bioaf/bioaf-backend:${{ needs.release.outputs.tag }}
            ghcr.io/bioaf/bioaf-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: docker/Dockerfile.frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=
          tags: |
            ghcr.io/bioaf/bioaf-frontend:${{ needs.release.outputs.tag }}
            ghcr.io/bioaf/bioaf-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push cellxgene
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cellxgene
          push: true
          tags: |
            ghcr.io/bioaf/bioaf-cellxgene:${{ needs.release.outputs.tag }}
            ghcr.io/bioaf/bioaf-cellxgene:latest
          cache-from: type=gha,scope=cellxgene
          cache-to: type=gha,mode=max,scope=cellxgene
