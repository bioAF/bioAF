name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Terraform validation
  # ──────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: true
    defaults:
      run:
        working-directory: backend/terraform
    steps:
      - uses: actions/checkout@v5

      # The version the backend image ships (docker/Dockerfile.backend); backend/tests/test_ci_workflow.py
      # fails when the two drift apart.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform fmt check (GCP and AWS)
        run: |
          terraform version
          terraform fmt -check -recursive modules
          terraform fmt -check -recursive aws/modules

      # Every module of both providers is validated, even after one fails, and each outcome is listed in
      # the job summary. A tree with no modules fails: a move must not leave nothing validated.
      - name: Terraform validate (each GCP and AWS module)
        run: |
          failed=()
          {
            echo "### Terraform $(terraform version | head -n 1)"
            echo "| Module | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for tree in modules aws/modules; do
            found=0
            for m in "$tree"/*/; do
              [ -f "$m/main.tf" ] || continue
              found=1
              m="${m%/}"
              echo "== $m =="
              if terraform -chdir="$m" init -backend=false -no-color -input=false \
                && terraform -chdir="$m" validate -no-color; then
                echo "| $m | valid |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| $m | FAILED |" >> "$GITHUB_STEP_SUMMARY"
                failed+=("$m")
              fi
            done
            if [ "$found" = 0 ]; then
              echo "| $tree | no modules found |" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$tree (no modules)")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Terraform validation failed: ${failed[*]}"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # FastAPI backend
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.12-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy . --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bioaf_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bioaf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      BIOAF_TEST_DATABASE_URL: postgresql+asyncpg://bioaf_test:test@localhost:5432/bioaf_test
    steps:
      # Full history and tags: the historical upgrade matrix (plan 9) builds every released schema
      # from the release's own migrations, read from local Git objects.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.12-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: |
          echo "install_started=$(date +%s)" >> "$RUNNER_TEMP/timings.env"
          pip install -r requirements.txt -r requirements-dev.txt
          echo "install_finished=$(date +%s)" >> "$RUNNER_TEMP/timings.env"

      # Runtime evidence (plan 4): per-phase timing, JUnit outcomes, pytest output and the
      # environment, kept as an artifact even when the run fails.
      - name: Record test environment
        run: |
          mkdir -p test-artifacts
          {
            echo "commit=$GITHUB_SHA"
            echo "python=$(python --version 2>&1)"
            echo "cpus=$(nproc)"
            echo "memory_bytes=$(free -b | awk '/^Mem:/ {print $2}')"
            echo "pytest_command=pytest -n auto --tb=short --cov=app --cov-report=term-missing --cov-report=json -q"
            echo "unit_command=python -m tests.support.unit_selection -q -n 0 --cov=app --cov-report=json"
          } > test-artifacts/environment.txt
          pip freeze > test-artifacts/pip-freeze.txt

      - name: Run tests
        run: |
          # The default shell is bash -eo pipefail; capture the status so the finish time is still written.
          # Not fail-fast (plan 8): every test runs, so a failed run still reports every failure.
          echo "tests_started=$(date +%s)" >> "$RUNNER_TEMP/timings.env"
          status=0
          pytest -n auto --tb=short --cov=app --cov-report=term-missing \
            --cov-report=json:test-artifacts/coverage.json -q \
            --junitxml=test-artifacts/junit.xml --phase-report=test-artifacts/phases.jsonl \
            2>&1 | tee test-artifacts/pytest-output.txt || status=$?
          echo "tests_finished=$(date +%s)" >> "$RUNNER_TEMP/timings.env"
          # Read by the coverage comment: a failed run's coverage is partial.
          echo "$status" > test-artifacts/exit-status
          exit $status

      # The reviewed unit selection (tests/support/unit_selection.py), measured on its own and reported
      # in its own table; not gated. It gets an unreachable database URL: it must not need PostgreSQL.
      - name: Run the unit selection
        if: always()
        env:
          BIOAF_TEST_DATABASE_URL: postgresql+asyncpg://unit:none@127.0.0.1:9/no_database
          COVERAGE_FILE: ${{ runner.temp }}/unit-coverage/.coverage
        run: |
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          status=0
          python -m tests.support.unit_selection -q -n 0 --cov=app \
            --cov-report=json:test-artifacts/unit-coverage.json || status=$?
          echo "$status" > test-artifacts/unit-exit-status
          exit $status

      - name: Summarize test timing
        if: always()
        run: |
          cp "$RUNNER_TEMP/timings.env" test-artifacts/timings.env || true
          {
            echo '```'
            cat test-artifacts/timings.env || true
            python -m tests.plugins.phase_report test-artifacts/phases.jsonl || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: backend/test-artifacts/
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Next.js frontend
  # ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          status=0
          npm test -- --passWithNoTests --coverage --coverageReporters=json --coverageReporters=text-summary \
            || status=$?
          mkdir -p coverage
          echo "$status" > coverage/exit-status
          exit $status

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/coverage-final.json
            frontend/coverage/exit-status
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # SDKs and shell scripts
  # ──────────────────────────────────────────────
  # The Python SDK is tested as its built wheel, installed into a clean virtualenv and imported from
  # outside the checkout, so a packaging defect fails here rather than for a user.
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Build the wheel
        run: |
          mkdir -p sdk-evidence
          python -m pip wheel --no-deps -w sdk-evidence sdk/python
          ls sdk-evidence

      - name: Install the wheel into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/pip" install "$(ls sdk-evidence/bioaf_sdk-*.whl)[dev]"
          "$RUNNER_TEMP/sdk-venv/bin/pip" freeze > sdk-evidence/pip-freeze.txt

      - name: Import the installed package, not the checkout
        working-directory: ${{ runner.temp }}
        run: |
          location=$("$RUNNER_TEMP/sdk-venv/bin/python" -c "import bioaf, bioaf.extractors.anndata; print(bioaf.__file__)")
          echo "bioaf loaded from $location"
          case "$location" in
            "$GITHUB_WORKSPACE"/*) echo "::error::bioaf was imported from the checkout"; exit 1 ;;
          esac

      # From outside the checkout with importlib mode, so nothing puts sdk/python/src on sys.path. The
      # suite has no optional skips; any skip fails the job.
      - name: Run the tests against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          status=0
          "$RUNNER_TEMP/sdk-venv/bin/python" -m pytest "$GITHUB_WORKSPACE/sdk/python/tests" \
            --import-mode=importlib -p no:cacheprovider -rs \
            --junitxml="$GITHUB_WORKSPACE/sdk-evidence/junit.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/sdk-evidence/pytest-output.txt" || status=$?
          python3 - "$GITHUB_WORKSPACE/sdk-evidence/junit.xml" <<'EOF' >> "$GITHUB_STEP_SUMMARY" || status=1
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print("### Python SDK (installed wheel)\n")
          print("\n".join(f"- {k}: {v}" for k, v in counts.items()))
          sys.exit(1 if counts["tests"] == 0 or counts["skipped"] else 0)
          EOF
          exit $status

      - name: Upload Python SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-evidence
          path: sdk-evidence/
          if-no-files-found: warn

  # The R SDK is built as a source package, installed into an empty library and tested from there, then
  # checked with R CMD check. Seurat and the test packages are mandatory: a missing one fails the job
  # (scripts/ci/r_sdk_tests.R) instead of skipping the Seurat extractor test. arrow is optional and not
  # installed: the suite does not exercise checkpoint uploads. _R_CHECK_FORCE_SUGGESTS_=false lets
  # R CMD check run without it.
  r-sdk:
    name: R SDK
    runs-on: ubuntu-latest
    env:
      R_EVIDENCE: ${{ github.workspace }}/r-evidence
    steps:
      - uses: actions/checkout@v5

      - name: Start the clock
        run: |
          mkdir -p "$R_EVIDENCE"
          echo "deps_started=$(date +%s)" >> "$R_EVIDENCE/timings.env"

      # Prebuilt Ubuntu binaries from Posit Public Package Manager; pak installs their system libraries.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdk/r
          dependencies: '"hard"'
          extra-packages: |
            any::Seurat
            any::testthat
            any::withr
            any::mockery
            any::xml2

      - name: Record dependency install time
        run: |
          echo "deps_finished=$(date +%s)" >> "$R_EVIDENCE/timings.env"
          Rscript -e 'ip <- installed.packages(fields = "Built"); write.csv(ip[, c("Package", "Version", "LibPath", "Built")], row.names = FALSE)' \
            > "$R_EVIDENCE/installed-packages.csv"

      - name: Build the source package
        working-directory: ${{ runner.temp }}
        run: |
          R CMD build --no-manual "$GITHUB_WORKSPACE/sdk/r"
          cp bioaf_*.tar.gz "$R_EVIDENCE/"

      - name: Install it into an empty library
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p r-lib
          R CMD INSTALL --library=r-lib bioaf_*.tar.gz

      - name: Run the tests against the installed package
        working-directory: ${{ runner.temp }}
        run: |
          R_LIBS="$RUNNER_TEMP/r-lib" Rscript "$GITHUB_WORKSPACE/scripts/ci/r_sdk_tests.R" \
            "$GITHUB_WORKSPACE/sdk/r/tests/testthat" "$R_EVIDENCE/junit.xml" "$R_EVIDENCE/tests-summary.md" \
            2>&1 | tee "$R_EVIDENCE/tests-output.txt"

      - name: R CMD check
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          echo "check_started=$(date +%s)" >> "$R_EVIDENCE/timings.env"
          R CMD check --no-manual bioaf_*.tar.gz 2>&1 | tee "$R_EVIDENCE/check-output.txt" || true
          echo "check_finished=$(date +%s)" >> "$R_EVIDENCE/timings.env"
          cp bioaf.Rcheck/00check.log "$R_EVIDENCE/" || true
          cp bioaf.Rcheck/tests/testthat.Rout* "$R_EVIDENCE/" 2>/dev/null || true
          python3 "$GITHUB_WORKSPACE/scripts/ci/r_check_status.py" "$R_EVIDENCE/00check.log" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: always()
        run: |
          {
            cat "$R_EVIDENCE/tests-summary.md" 2>/dev/null || echo "R SDK tests did not report."
            echo
            echo '```'
            cat "$R_EVIDENCE/timings.env"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-sdk-evidence
          path: r-evidence/
          if-no-files-found: warn

  # The Bats suites for ./bioaf, the installers and the update agent. Ubuntu runners have Docker,
  # Compose, a running daemon, git and openssl, so the Linux prerequisite test runs here; cryptography
  # lets the encryption bootstrap test run. The only skip accepted is the network guard's.
  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bats and the test prerequisites
        run: |
          npm install -g bats@1.13.0
          python -m pip install "cryptography>=50.0.0"
          mkdir -p shell-evidence
          {
            bats --version
            python --version
            python -c "import cryptography; print('cryptography', cryptography.__version__)"
            docker version --format 'docker {{.Server.Version}}'
            docker compose version
            git --version
            openssl version
          } | tee shell-evidence/environment.txt

      - name: Run the Bats suites
        run: |
          status=0
          bats --formatter tap --report-formatter junit --output shell-evidence tests/shell \
            2>&1 | tee shell-evidence/bats-output.tap || status=$?
          total=$(grep -cE '^(ok|not ok) ' shell-evidence/bats-output.tap || true)
          failed=$(grep -cE '^not ok ' shell-evidence/bats-output.tap || true)
          skips=$(grep -E '^ok .* # skip' shell-evidence/bats-output.tap || true)
          unexpected=$(printf '%s\n' "$skips" | grep -v -e '^$' -e '# skip ghcr.io unreachable$' || true)
          {
            echo "### Shell tests (Bats)"
            echo
            echo "- total: $total"
            echo "- failed: $failed"
            echo "- skipped: $(printf '%s' "$skips" | grep -c . || true)"
            if [ -n "$skips" ]; then echo; echo '```'; echo "$skips"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected skips (only 'ghcr.io unreachable' is accepted):"
            echo "$unexpected"
            status=1
          fi
          exit $status

      - name: Upload shell test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-evidence
          path: shell-evidence/
          if-no-files-found: warn

  # One comment per pull request with backend and frontend line and branch coverage, the gates, the
  # unit selection, the same by area, and for the lines the pull request added; updated in place on
  # every run. Fork pull requests get a read-only token, so for them the report goes to the job
  # summary only. A failed gate fails this job after the comment is posted.
  #
  # This is also the merge gate: the main ruleset requires this one check. It needs every other job in
  # this workflow (held by backend/tests/test_ci_workflow.py) and fails unless each succeeded; the
  # coverage report is still built and posted when one did not.
  coverage-comment:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs:
      - terraform-validate
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - python-sdk
      - r-sdk
      - shell-tests
      - security-scan
      - docs-lint
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-test-evidence
          path: coverage-in/backend

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: coverage-in/frontend

      - name: Build report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --unified=0 "$BASE_SHA...$HEAD_SHA" > coverage-in/pr.diff
          # Gates (scripts/ci/coverage_policy.json) pass only on complete, successful runs. The status
          # is kept for the enforce step so the comment is still posted when a gate fails.
          status=0
          python3 scripts/ci/coverage_report.py \
            --backend coverage-in/backend/coverage.json \
            --frontend coverage-in/frontend/coverage-final.json \
            --backend-unit coverage-in/backend/unit-coverage.json \
            --diff coverage-in/pr.diff \
            --commit "$HEAD_SHA" \
            --backend-status "$(cat coverage-in/backend/exit-status 2>/dev/null)" \
            --frontend-status "$(cat coverage-in/frontend/exit-status 2>/dev/null)" \
            --backend-unit-status "$(cat coverage-in/backend/unit-exit-status 2>/dev/null)" \
            --policy scripts/ci/coverage_policy.json --enforce \
            --output coverage-report.md || status=$?
          echo "$status" > gate-status
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the pull request comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- bioaf-coverage-report -->'
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@coverage-report.md > /dev/null
          else
            gh pr comment "$PR" --body-file coverage-report.md
          fi

      - name: Enforce coverage gates
        if: always()
        run: |
          status=$(cat gate-status 2>/dev/null || echo missing)
          if [ "$status" != "0" ]; then
            echo "::error::Coverage gates failed (report status: $status). See the Gates table in the job summary."
            exit 1
          fi

      # Only success passes: a failed, cancelled or skipped dependency fails the merge gate.
      - name: Enforce required checks
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required_checks.py --needs "$NEEDS_JSON" --summary "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Security & docs
  # ──────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@v3.88.8
        with:
          extra_args: --only-verified

  docs-lint:
    name: Docs & ADR Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          config: ".markdownlint.json"
