name: Backend test benchmark

# Manually triggered runtime comparison (plan 4). Never runs on pull requests: the
# ordinary CI job keeps default durability and remains the correctness gate.
# Run once per variant, at least twice each, and compare with
# `python -m tests.plugins.phase_report` over the downloaded phases.jsonl files.

on:
  workflow_dispatch:
    inputs:
      test_bcrypt_rounds:
        description: "Test password hashing cost (12 = unchanged baseline)"
        type: choice
        options: ["4", "12"]
        default: "4"
      durability:
        description: "PostgreSQL durability on the disposable service container"
        type: choice
        options: ["default", "tuned"]
        default: "default"
      scope:
        description: "Representative subset or the full backend suite"
        type: choice
        options: ["subset", "full"]
        default: "subset"
      workers:
        description: "pytest-xdist worker count (-n)"
        type: string
        default: "auto"

permissions:
  contents: read

# Benchmark runs never report installation metrics (ADR-075).
env:
  BIOAF_INSTALL_METRICS_DISABLED: "1"

jobs:
  benchmark:
    name: Benchmark (${{ inputs.scope }}, rounds ${{ inputs.test_bcrypt_rounds }}, ${{ inputs.durability }}, -n ${{ inputs.workers }})
    # The backend CI job's runner (ci.yml backend-test): a worker-count result measured on another image is not
    # evidence for CI. ubuntu-24.04 ships the PostgreSQL 16 client the schema-upgrade tests need.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bioaf_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bioaf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        # A job's defaults.run replaces the workflow's, so the shell is restated here (pipefail).
        shell: bash
        working-directory: backend
    env:
      BIOAF_TEST_DATABASE_URL: postgresql+asyncpg://bioaf_test:test@localhost:5432/bioaf_test
      BIOAF_TEST_BCRYPT_ROUNDS: ${{ inputs.test_bcrypt_rounds }}
    steps:
      # Full history and tags, as in CI: the historical upgrade matrix reads every release's migrations from Git.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Dispatch values reach the shell only as quoted environment variables, never as script text. The worker
      # count is free text, so it is checked here, before anything is installed: `auto` or a whole number from 1 to
      # MAX_WORKERS (the public ubuntu-24.04 runner has 4 CPUs). The syntax and length are checked before the number
      # is compared, and a rejected value is never repeated in the log.
      - name: Validate inputs
        id: validate
        env:
          WORKERS: ${{ inputs.workers }}
          MAX_WORKERS: "4"
        run: |
          if [ "$WORKERS" = "auto" ]; then
            echo "workers=auto"
            exit 0
          fi
          if [[ ! "$WORKERS" =~ ^[1-9][0-9]?$ ]] || [ "$WORKERS" -gt "$MAX_WORKERS" ]; then
            echo "::error::Unsupported workers value. Use auto or a whole number from 1 to $MAX_WORKERS."
            exit 1
          fi
          echo "workers=$WORKERS"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # The uv version the backend image copies (docker/Dockerfile.backend); the cache is keyed on the lock.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: |
          echo "install_started=$(date +%s)" >> "$RUNNER_TEMP/timings.env"
          uv sync --locked --python 3.12 --no-python-downloads
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "install_finished=$(date +%s)" >> "$RUNNER_TEMP/timings.env"

      # GitHub service options cannot pass postgres command arguments, so the candidate
      # settings are applied with ALTER SYSTEM and verified from a new connection.
      - name: Tune the service container
        if: inputs.durability == 'tuned'
        run: python -m tests.support.disposable_pg tune-ci-service

      - name: Run tests
        env:
          SCOPE: ${{ inputs.scope }}
          WORKERS: ${{ inputs.workers }}
        run: |
          mkdir -p test-artifacts
          uv pip freeze > test-artifacts/pip-freeze.txt
          {
            echo "commit=${GITHUB_SHA:-}"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "scope=$SCOPE"
            echo "workers=$WORKERS"
            echo "cpus=$(nproc)"
            echo "memory_bytes=$(free -b 2>/dev/null | awk '/^Mem:/ {print $2}')"
            echo "python=$(python --version 2>&1)"
            echo "platform=$(python -c 'import sysconfig; print(sysconfig.get_platform())')"
            echo "uv=$(uv --version)"
            echo "lock_sha256=$(sha256sum uv.lock | cut -d' ' -f1)"
          } > test-artifacts/environment.txt
          if [ "$SCOPE" = "subset" ]; then
            targets=$(grep -v '^#' tests/benchmark_subset.txt | tr '\n' ' ')
          else
            targets=tests
          fi
          echo "tests_started=$(date +%s)" >> "$RUNNER_TEMP/timings.env"
          status=0
          # No -x: a comparison needs every outcome, not the first failure.
          # $targets is a word list on purpose.
          # shellcheck disable=SC2086
          # The same options as CI's backend run (ci.yml), so the full scope measures the CI command; only -n differs.
          pytest -n "$WORKERS" --tb=short --cov=app --cov-report=term-missing \
            --cov-report=json:test-artifacts/coverage.json -q $targets \
            --junitxml=test-artifacts/junit.xml --phase-report=test-artifacts/phases.jsonl \
            2>&1 | tee test-artifacts/pytest-output.txt || status=$?
          echo "tests_finished=$(date +%s)" >> "$RUNNER_TEMP/timings.env"
          echo "$status" > test-artifacts/exit-status
          exit $status

      # Runs after a rejected input too: it reports the rejection instead of the value, and tolerates missing evidence.
      - name: Summarize
        if: always()
        env:
          SCOPE: ${{ inputs.scope }}
          ROUNDS: ${{ inputs.test_bcrypt_rounds }}
          DURABILITY: ${{ inputs.durability }}
          WORKERS: ${{ inputs.workers }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          if [ "$VALIDATION" != "success" ]; then
            echo "Inputs were rejected (workers must be auto or 1 to 4); no tests ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$RUNNER_TEMP/timings.env" test-artifacts/timings.env || true
          {
            echo '```'
            echo "scope=$SCOPE rounds=$ROUNDS durability=$DURABILITY workers=$WORKERS cpus=$(nproc)"
            cat test-artifacts/timings.env || true
            python -m tests.plugins.phase_report test-artifacts/phases.jsonl || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact name carries the inputs, so it is built only from accepted values.
      - name: Upload evidence
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ inputs.scope }}-r${{ inputs.test_bcrypt_rounds }}-${{ inputs.durability }}-n${{ inputs.workers }}-${{ github.run_id }}
          path: backend/test-artifacts/
